services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    container_name: agendamento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  agendamento-service:
    build: ./agendamento-service
    container_name: agendamento-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  historico-service:
    build: ./historico-service
    container_name: historico-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      agendamento-service:
        condition: service_started

  notificacao-service:
    build: ./notificacao-service
    container_name: notificacao-service
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      AGENDAMENTO_SERVICE_URL: http://agendamento-service:8081
      HISTORICO_SERVICE_URL: http://historico-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - agendamento-service
      - historico-service

volumes:
  postgres_data: